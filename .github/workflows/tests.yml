
name: Carely Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install iOS Simulator runtime
        run: |
          xcodebuild -downloadPlatform iOS

      - name: List available simulators
        run: |
          xcrun simctl list devices available

      - name: Select iPhone simulator
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = [
              device
              for runtime, items in data["devices"].items()
              if runtime.startswith("com.apple.CoreSimulator.SimRuntime.iOS-")
              for device in items
              if device["isAvailable"] and device["name"].startswith("iPhone")
          ]
          if not devices:
              sys.exit("No available iPhone simulator found after installing iOS runtime")
          print(devices[0]["udid"])
          ')
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: $DEVICE_ID"

      - name: Run tests
        run: |
          xcodebuild test \
            -project Carely.xcodeproj \
            -scheme Carely \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}' \
            CODE_SIGNING_ALLOWED=NO
