
name: Carely Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun simctl list devices available

      - name: Select an available iPhone simulator
        run: |
          SIMULATOR_ID=$(python3 - <<'PY'
          import json
          import subprocess
          import sys

          result = subprocess.run(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              capture_output=True,
              text=True,
              check=True
          )

          data = json.loads(result.stdout)
          devices = [
              device
              for runtime_devices in data["devices"].values()
              for device in runtime_devices
              if device.get("isAvailable", False)
              and device.get("name", "").startswith("iPhone")
          ]

          if not devices:
              print("No available iPhone simulators found.", file=sys.stderr)
              sys.exit(1)

          preferred = next(
              (device for device in devices
               if device["name"] == "iPhone 16e"),
              None
          )

          if preferred is None:
              preferred = next(
                  (device for device in devices
                   if device["name"] == "iPhone 16"),
                  devices[0]
              )

          print(f"Selected: {preferred['name']} ({preferred['udid']})",
                file=sys.stderr)
          print(preferred["udid"])
          PY
          )

          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          xcodebuild test \
            -project Carely.xcodeproj \
            -scheme Carely \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO
